{% extends "base.html" %}

{% block title %}Set New Password - Hospital Metrics 3D{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Set new password
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Please choose a strong password for your account.
            </p>
        </div>
        <form class="mt-8 space-y-6" action="/api/v1/auth/reset-password/{{ token }}" method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="password" class="sr-only">New password</label>
                    <input id="password" name="password" type="password" required
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                           placeholder="New password">
                </div>
                <div>
                    <label for="password_confirm" class="sr-only">Confirm new password</label>
                    <input id="password_confirm" name="password_confirm" type="password" required
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                           placeholder="Confirm new password">
                </div>
            </div>

            <div>
                <button type="submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Set new password
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Client-side password validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('password_confirm').value;
        
        // Check password length
        if (password.length < 12) {
            alert('Password must be at least 12 characters long');
            e.preventDefault();
            return;
        }
        
        // Check for uppercase letter
        if (!/[A-Z]/.test(password)) {
            alert('Password must contain at least one uppercase letter');
            e.preventDefault();
            return;
        }
        
        // Check for number
        if (!/\d/.test(password)) {
            alert('Password must contain at least one number');
            e.preventDefault();
            return;
        }
        
        // Check for special character
        if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
            alert('Password must contain at least one special character');
            e.preventDefault();
            return;
        }
        
        // Check passwords match
        if (password !== confirmPassword) {
            alert('Passwords do not match');
            e.preventDefault();
            return;
        }
    });
</script>
{% endblock %}
