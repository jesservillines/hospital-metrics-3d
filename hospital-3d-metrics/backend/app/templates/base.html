<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hospital Metrics 3D{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">Hospital Metrics 3D</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/visualization">3D Visualization</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="userNav">
                    <!-- This will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block base_scripts %}
    <script>
        // Check authentication state and update navigation
        function updateNavigation() {
            const userNav = document.getElementById('userNav');
            const token = localStorage.getItem('access_token');
            
            if (token) {
                // Fetch user info
                fetch('/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data || !data.username) {
                        console.error('Invalid user data received');
                        throw new Error('Invalid user data');
                    }

                    userNav.innerHTML = `
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user"></i> ${data.username}
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="userDropdown">
                                <li>
                                    <a class="dropdown-item" href="#" onclick="navigateToProfile(event, '${data.role}')">
                                        ${data.role === 'ADMIN' ? 'Admin Profile' : 'Profile'}
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" onclick="logout(event)" href="#">Logout</a></li>
                            </ul>
                        </li>
                    `;
                })
                .catch(error => {
                    console.error('Error in updateNavigation:', error);
                    localStorage.removeItem('access_token');
                    userNav.innerHTML = getLoginRegisterLinks();
                });
            } else {
                userNav.innerHTML = getLoginRegisterLinks();
            }
        }

        function getLoginRegisterLinks() {
            return `
                <li class="nav-item">
                    <a class="nav-link" href="/api/v1/auth/login">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/api/v1/auth/register">Register</a>
                </li>
            `;
        }

        // Navigate to profile with proper error handling
        function navigateToProfile(event, role) {
            event.preventDefault();
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                console.error('No token found');
                window.location.replace('/api/v1/auth/login');
                return;
            }

            const profileUrl = role === 'ADMIN' ? '/api/v1/admin/profile' : '/api/v1/profile';
            
            // First verify the token is still valid
            fetch('/api/v1/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Token validation failed: ${response.status}`);
                }
                return response.json();
            })
            .then(() => {
                // Token is valid, proceed with profile navigation
                fetch(profileUrl, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Profile access failed: ${response.status}`);
                    }
                    window.location.href = profileUrl;
                })
                .catch(error => {
                    console.error('Error accessing profile:', error);
                    if (error.message.includes('401') || error.message.includes('403')) {
                        localStorage.removeItem('access_token');
                        window.location.replace('/api/v1/auth/login');
                    } else {
                        alert('Error accessing profile. Please try again later.');
                    }
                });
            })
            .catch(error => {
                console.error('Error validating token:', error);
                localStorage.removeItem('access_token');
                window.location.replace('/api/v1/auth/login');
            });
        }

        // Logout function with enhanced error handling
        function logout(event) {
            if (event) {
                event.preventDefault();
            }
            console.log('Logout function called');
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                console.log('No token found, redirecting to login');
                window.location.replace('/api/v1/auth/login');
                return;
            }

            console.log('Making logout request...');
            fetch('/api/v1/auth/logout', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Logout failed: ${response.status}`);
                }
                return response.json();
            })
            .then(() => {
                console.log('Logged out successfully');
                localStorage.removeItem('access_token');
                window.location.replace('/api/v1/auth/login');
            })
            .catch(error => {
                console.error('Error during logout:', error);
                localStorage.removeItem('access_token');
                window.location.replace('/api/v1/auth/login');
            });
        }

        // Update navigation when page loads
        document.addEventListener('DOMContentLoaded', updateNavigation);
    </script>
    {% endblock %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
